<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classification Pipeline Audit Report</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
  <style>
    body {
      margin: 0;
      background: #f7f5f0;
      color: #0f0f0f;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
    .page-header {
      background: #0f0f0f;
      color: #fff;
      padding: 1.25rem 1.5rem;
      border-bottom: 3px solid #1a4fbf;
    }
    .page-header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .page-header p {
      margin: 0.35rem 0 0;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.72);
    }
    .markdown-body {
      box-sizing: border-box;
      max-width: 900px;
      margin: 2rem auto;
      padding: 2.5rem 3rem;
      background: #fff;
      border: 1px solid #e2dfda;
    }
    @media (max-width: 768px) {
      .markdown-body {
        margin: 1rem;
        padding: 1.5rem;
      }
    }
    .loading, .error {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1.5rem;
    }
    .error {
      color: #8b0000;
      background: #fff;
      border: 1px solid #e2dfda;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Classification Pipeline Audit Report</h1>
    <p>Academic Research Catalog · Cannabis Paper Scraper · 28 June 2026</p>
  </header>
  <div id="status" class="loading">Loading report…</div>
  <article id="content" class="markdown-body" hidden></article>
  <script type="module">
    import { marked } from "https://cdn.jsdelivr.net/npm/marked@15/+esm";

    const statusEl = document.getElementById("status");
    const contentEl = document.getElementById("content");

    try {
      const response = await fetch("./classification_pipeline_audit_report.md");
      if (!response.ok) {
        throw new Error(`Failed to load report (${response.status})`);
      }
      const markdown = await response.text();
      contentEl.innerHTML = marked.parse(markdown);
      statusEl.hidden = true;
      contentEl.hidden = false;
    } catch (error) {
      statusEl.className = "error";
      statusEl.textContent = `Could not load the audit report: ${error.message}`;
    }
  </script>
</body>
</html>
