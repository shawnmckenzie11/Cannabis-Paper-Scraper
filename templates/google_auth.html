<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Google | McKenzian Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --google-blue: #4285f4;
            --font-display: 'Outfit', sans-serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .google-card {
            background: #171b26;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .google-logo {
            display: flex;
            justify-content: center;
            gap: 2px;
            font-size: 1.5rem;
            font-weight: 700;
            font-family: var(--font-display);
            margin-bottom: 1rem;
        }
        .logo-g { color: #4285f4; }
        .logo-o1 { color: #ea4335; }
        .logo-o2 { color: #fbbc05; }
        .logo-g2 { color: #4285f4; }
        .logo-l { color: #34a853; }
        .logo-e { color: #ea4335; }

        .title {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .account-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .account-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .account-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(66, 133, 244, 0.4);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--google-blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .account-details {
            display: flex;
            flex-direction: column;
        }

        .account-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .account-email {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--card-border);
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        .custom-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            padding: 10px;
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        input:focus {
            border-color: var(--google-blue);
        }

        .btn-submit {
            background: var(--google-blue);
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: center;
        }

        .btn-submit:hover {
            background: #357ae8;
        }

        .notice {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #ffb74d;
            background: rgba(255, 183, 77, 0.08);
            border: 1px solid rgba(255, 183, 77, 0.2);
            padding: 8px;
            border-radius: 6px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="google-card">
        <div class="google-logo">
            <span class="logo-g">G</span><span class="logo-o1">o</span><span class="logo-o2">o</span><span class="logo-g2">g</span><span class="logo-l">l</span><span class="logo-e">e</span>
        </div>
        <div class="title">Simulated Google Sign-In</div>
        <div class="subtitle">to continue to McKenzian Portal</div>

        <form class="custom-form" onsubmit="handleCustomSubmit(event)">
            <div class="input-group">
                <label for="email">Google Email</label>
                <input type="email" id="email" placeholder="name@domain.com" required>
            </div>
            <div class="input-group">
                <label for="name">Display Name (Optional)</label>
                <input type="text" id="name" placeholder="John Doe">
            </div>
            <button type="submit" class="btn-submit">Continue</button>
        </form>
    </div>

    <script>
        function handleCustomSubmit(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const name = document.getElementById("name").value;
            window.location.href = `/auth/google/callback?email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}`;
        }
    </script>
</body>
</html>
