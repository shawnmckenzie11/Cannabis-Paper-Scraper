# fly.toml app configuration file generated for cannabis-paper-scraper on 2026-06-03T12:22:40-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cannabis-paper-scraper'
primary_region = 'yyz'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the VM up so the in-process daily harvest thread actually runs.
  # auto_stop=stop only watches HTTP idle; background ingest does not count as traffic.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "mckenzian_db_volume"
  destination = "/data"
