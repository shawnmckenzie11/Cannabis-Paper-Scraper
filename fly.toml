# fly.toml app configuration file generated for cannabis-paper-scraper on 2026-06-03T12:22:40-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cannabis-paper-scraper'
primary_region = 'yyz'

[build]

[env]
  CHEAP_OPS = '1'
  AUTO_HARVEST_CLASSIFY = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  # Daily harvest is GitHub Actions (fly machine start + SSH). Autostop is safe:
  # background ingest no longer requires a 24/7 VM. First HTTP request auto-starts.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[mounts]]
  source = "mckenzian_db_volume"
  destination = "/data"
