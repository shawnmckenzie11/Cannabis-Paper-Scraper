name: Continuous Integration for Heuristics (CI/CH)

on:
  push:
    branches: [ main ]
    paths:
      - 'heuristics_config.json'
      - 'heuristics_engine.py'
      - 'extractor.py'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'heuristics_config.json'
      - 'heuristics_engine.py'
      - 'extractor.py'
      - 'tests/**'

jobs:
  run-heuristics-regression:
    runs-args:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run CI/CH Heuristics Regression Tests
      run: |
        python -m unittest tests/run_cich_regression.py
