# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
      # One-shot billing-recovery redeploy of current main (same image contents).
      - cursor/fly-redeploy-daily-harvest-21f3
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify daily_harvest on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: cannabis-paper-scraper
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "FLY_API_TOKEN GitHub secret is not set."
            exit 1
          fi

          MACHINE_JSON=$(flyctl machines list -a "$FLY_APP" --json)
          MACHINE_ID=$(python3 -c "
          import json, sys
          machines = json.loads(sys.argv[1])
          if not machines:
              sys.exit('No Fly machines found for app')
          print(machines[0]['id'])
          " "$MACHINE_JSON")
          echo "Using machine ${MACHINE_ID}"
          flyctl machine start "$MACHINE_ID" -a "$FLY_APP"

          echo "Waiting for HTTP..."
          ok=0
          i=0
          while [ "$i" -lt 36 ]; do
            i=$((i + 1))
            if curl -fsS --max-time 15 \
              "https://${FLY_APP}.fly.dev/api/scheduler/status" >/tmp/scheduler_status.json; then
              echo "Scheduler status:"
              cat /tmp/scheduler_status.json
              ok=1
              break
            fi
            echo "Attempt ${i}: site not ready yet"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Timed out waiting for ${FLY_APP} to serve HTTP"
            exit 1
          fi

          echo "Confirming daily_harvest is importable..."
          flyctl ssh console -a "$FLY_APP" -C "sh -c 'cd /app && python3 -c \"import daily_harvest; print(daily_harvest.__file__)\"'"

          # Full harvest only on this recovery branch / manual dispatch, not every main push.
          if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Running due harvest cycle (--harvest-only)..."
            flyctl ssh console -a "$FLY_APP" -C "sh -c 'cd /app && python3 -m daily_harvest --harvest-only'"
            echo "Post-harvest scheduler status:"
            curl -fsS --max-time 30 "https://${FLY_APP}.fly.dev/api/scheduler/status" | tee /tmp/scheduler_status_after.json
            python3 -c "
          import json, sys
          data = json.load(open('/tmp/scheduler_status_after.json'))
          status = data.get('last_run_status') or ''
          print('last_run_date=', data.get('last_run_date'))
          print('last_run_status=', status)
          if status.startswith('Error'):
              sys.exit('Harvest status is Error')
          "
          fi
