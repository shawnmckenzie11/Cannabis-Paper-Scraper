# One-shot: wait out a stale harvest lock, then run python3 -m daily_harvest.
# Not intended to merge; remove after the billing-recovery harvest completes.
name: Fly harvest verify
on:
  push:
    branches:
      - cursor/fly-redeploy-daily-harvest-21f3
jobs:
  harvest:
    name: Verify harvest on live image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: cannabis-paper-scraper
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Start machine and run due harvest
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "FLY_API_TOKEN GitHub secret is not set."
            exit 1
          fi

          MACHINE_JSON=$(flyctl machines list -a "$FLY_APP" --json)
          MACHINE_ID=$(python3 -c "
          import json, sys
          machines = json.loads(sys.argv[1])
          if not machines:
              sys.exit('No Fly machines found for app')
          print(machines[0]['id'])
          " "$MACHINE_JSON")
          echo "Using machine ${MACHINE_ID}"
          flyctl machine start "$MACHINE_ID" -a "$FLY_APP"

          echo "Waiting for HTTP..."
          ok=0
          i=0
          while [ "$i" -lt 36 ]; do
            i=$((i + 1))
            if curl -fsS --max-time 15 \
              "https://${FLY_APP}.fly.dev/api/scheduler/status" >/tmp/scheduler_status.json; then
              echo "Scheduler status:"
              cat /tmp/scheduler_status.json
              ok=1
              break
            fi
            echo "Attempt ${i}: site not ready yet"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Timed out waiting for ${FLY_APP} to serve HTTP"
            exit 1
          fi

          echo "Confirming daily_harvest is importable..."
          flyctl ssh console -a "$FLY_APP" -C "sh -c 'cd /app && python3 -c \"import daily_harvest; print(daily_harvest.__file__)\"'"

          echo "Running due harvest, retrying while the metadata lock is held..."
          attempt=0
          while [ "$attempt" -lt 50 ]; do
            attempt=$((attempt + 1))
            echo "Harvest attempt ${attempt}"
            set +e
            flyctl ssh console -a "$FLY_APP" -C "sh -c 'cd /app && python3 -m daily_harvest --harvest-only'" \
              | tee /tmp/harvest_out.json
            ssh_rc=${PIPESTATUS[0]}
            set -e
            if [ "$ssh_rc" != "0" ]; then
              echo "ssh harvest exited ${ssh_rc}"
              exit "$ssh_rc"
            fi
            if python3 -c "
          import json, sys
          text = open('/tmp/harvest_out.json').read()
          start = text.find('{')
          if start < 0:
              sys.exit('no harvest JSON')
          data = json.loads(text[start:])
          harvest = data.get('harvest') or {}
          print('cycle_status=', data.get('status'), 'harvest_status=', harvest.get('status'), 'reason=', harvest.get('reason'))
          if harvest.get('status') == 'skipped' and harvest.get('reason') == 'locked':
              sys.exit(10)
          if data.get('status') in {'error', 'already_running'} or harvest.get('status') == 'error':
              sys.exit(1)
          "; then
              break
            fi
            rc=$?
            if [ "$rc" != "10" ]; then
              exit "$rc"
            fi
            echo "Harvest still locked; sleeping 60s"
            sleep 60
          done

          echo "Post-harvest scheduler status:"
          curl -fsS --max-time 30 "https://${FLY_APP}.fly.dev/api/scheduler/status" | tee /tmp/scheduler_status_after.json
          python3 -c "
          import json, sys
          data = json.load(open('/tmp/scheduler_status_after.json'))
          status = data.get('last_run_status') or ''
          print('last_run_date=', data.get('last_run_date'))
          print('last_run_status=', status)
          if status.startswith('Error'):
              sys.exit('Harvest status is Error')
          "
