name: Dev test suite (baseline-gated)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SENTRY_DSN: ""
      APP_ENV: test
      # Floor on collected tests; raise it as the suite grows.
      MIN_TOTAL_TESTS: "770"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Block baseline additions without 'baseline-update' label
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'baseline-update')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          added=$(git diff "$BASE_SHA"...HEAD -- ci/test_failure_baseline.txt | grep -E '^\+[^+]' | grep -vE '^\+\s*(#|$)' || true)
          if [ -n "$added" ]; then
            echo "This PR adds entries to ci/test_failure_baseline.txt:"
            echo "$added"
            echo "Add the 'baseline-update' label (owner approval) to allow this."
            exit 1
          fi

      - name: Set up Python (matches Dockerfile python:3.11-slim)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest==9.2.0

      - name: Run pytest
        id: pytest
        run: |
          set +e
          python -m pytest test_*.py tests/ -q -rfE --junitxml=pytest-report.xml
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = all passed, 1 = some failed (judged by baseline check). Anything else is fatal:
          # 2 interrupted, 3 internal error, 4 usage error, 5 no tests collected.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "pytest exited with $rc"; exit "$rc"
          fi

      - name: Fail only on failures not in ci/test_failure_baseline.txt
        run: python ci/check_test_baseline.py pytest-report.xml ci/test_failure_baseline.txt --min-total "$MIN_TOTAL_TESTS" $STRICT_FLAG
        env:
          STRICT_FLAG: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '--strict' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report
          path: pytest-report.xml
