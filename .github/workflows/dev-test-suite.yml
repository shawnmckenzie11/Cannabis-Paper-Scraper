name: Dev test suite (baseline-gated)

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SENTRY_DSN: ""
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (matches Dockerfile python:3.11-slim)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pytest

      - name: Run pytest (report only)
        run: |
          python -m pytest test_*.py tests/ -q -rfE --junitxml=pytest-report.xml || true

      - name: Fail only on failures not in ci/test_failure_baseline.txt
        run: python ci/check_test_baseline.py pytest-report.xml ci/test_failure_baseline.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
