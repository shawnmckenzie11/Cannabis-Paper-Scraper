# Daily PubMed harvest into the Hub dataset (or Cloudflare R2), then reload the Space.
# Does not deploy Fly.
name: Daily PubMed harvest

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      CATALOG_DATASET_ID: mckenziansolutions/cannabis-papers-catalog
      CATALOG_RELOAD_TOKEN: ${{ secrets.CATALOG_RELOAD_TOKEN }}
      SPACE_RELOAD_URL: ${{ secrets.SPACE_RELOAD_URL }}
      ENTREZ_EMAIL: ${{ secrets.ENTREZ_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_OBJECT: cannabis_papers.db
      DATABASE_PATH: ${{ github.workspace }}/cannabis_papers.db
      CHEAP_OPS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Require HF_TOKEN
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "Add repository secret HF_TOKEN (write token for mckenziansolutions)."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install awscli

      - name: Harvest into SQLite and publish catalog
        run: |
          unset DATABASE_URL
          python3 scripts/ci_daily_harvest.py --sqlite-path "${DATABASE_PATH}"

      - name: Reload Hugging Face Space catalog
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="${SPACE_RELOAD_URL:-https://mckenziansolutions-cannabis-paper-scraper.hf.space/api/catalog/reload}"
          if [ -z "${CATALOG_RELOAD_TOKEN:-}" ]; then
            echo "CATALOG_RELOAD_TOKEN not set; skip Space reload"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 --max-time 180 \
            -X POST \
            -H "X-Catalog-Reload-Token: ${CATALOG_RELOAD_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"pull_from_store": true}' \
            "${URL}"
          echo "Space catalog reload succeeded."
